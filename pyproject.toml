[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opendisplay-dashboard-creator"
version = "0.1.0"
description = "MVP compiler for OpenDisplay dashboard YAML definitions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
opendisplay-dashboard-compiler = "opendisplay_dashboard_creator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
