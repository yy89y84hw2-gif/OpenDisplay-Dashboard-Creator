[project]
name = "opendisplay-dashboard-creator"
version = "0.1.0"
description = "Core dashboard model and parser for OpenDisplay Dashboard Creator."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
