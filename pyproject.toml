[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opendisplay-dashboard-creator"
version = "0.1.0"
description = "MVP compiler for OpenDisplay dashboards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
opendisplay-dashboard-creator = "opendisplay_dashboard_creator.cli:main"
