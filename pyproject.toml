[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opendisplay-dashboard-creator"
version = "0.1.0"
description = "Compile OpenDisplay dashboard definitions to JSON"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.scripts]
opendisplay-dashboard-creator = "opendisplay_dashboard_creator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
